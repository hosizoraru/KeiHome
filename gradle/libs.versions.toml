# The stable BOM predates this RC; align direct Compose and test APIs explicitly.
androidxCompose = "1.13.0-rc01"
androidxAnnotation = "1.11.0"
androidxAnnotationExperimental = "1.6.0"
androidxAutofill = "1.3.0"
androidxCollection = "1.7.0"
androidxConcurrent = "1.3.0"
androidxPoolingContainer = "1.1.0"
androidxEmoji = "1.7.0"
