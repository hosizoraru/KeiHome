mmkv = { module = "com.tencent:mmkv", version.ref = "mmkv" }
zipflinger = { module = "com.android:zipflinger", version.ref = "zipflinger" }
miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui-android", version.ref = "miuix" }
miuix-icons = { module = "top.yukonga.miuix.kmp:miuix-icons-android", version.ref = "miuix" }
miuix-blur = { module = "top.yukonga.miuix.kmp:miuix-blur-android", version.ref = "miuix" }
miuix-preference = { module = "top.yukonga.miuix.kmp:miuix-preference-android", version.ref = "miuix" }
miuix-nav = { module = "top.yukonga.miuix.kmp:miuix-nav-android", version.ref = "miuix" }
miuix-glass = { module = "top.yukonga.miuix.kmp:miuix-glass-android", version.ref = "miuix" }
miuix-glass-icons = { module = "top.yukonga.miuix.kmp:miuix-glass-icons-android", version.ref = "miuix" }
miuix-material = { module = "top.yukonga.miuix.kmp:miuix-material-android", version.ref = "miuix" }

[bundles]
runtime-alignment = [
  "androidx-annotation",
  "androidx-annotation-experimental",
  "androidx-autofill",
  "androidx-collection",
  "androidx-collection-ktx",
  "androidx-concurrent-futures",
  "androidx-pooling-container",
  "androidx-emoji",
  "androidx-graphics-path",
  "androidx-graphics-shapes",
  "androidx-savedstate",
  "androidx-savedstate-compose",
  "androidx-savedstate-ktx",
  "androidx-tracing",
  "androidx-versionedparcelable",
  "androidx-window",
  "androidx-window-core",
  "jetbrains-annotations",
  "jspecify",
]
miuix = ["miuix-ui", "miuix-icons", "miuix-blur", "miuix-preference", "miuix-nav", "miuix-glass", "miuix-glass-icons", "miuix-material"]

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
