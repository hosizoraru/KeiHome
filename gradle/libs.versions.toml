androidxGraphicsShapes = "1.1.0"
androidxSavedState = "1.5.0"
androidxTracing = "2.0.5"
androidxVersionedParcelable = "1.2.1"
androidxWindow = "1.5.1"
jetbrainsAnnotations = "26.1.0"
jspecify = "1.0.1"
androidxTest = "1.7.0"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
